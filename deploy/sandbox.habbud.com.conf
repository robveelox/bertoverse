server {
    listen 80;
    listen [::]:80;
    server_name sandbox.habbud.com;
    root /var/www/greenroom/apps/client/dist;
    index index.html;
    access_log /var/log/nginx/habbud/sandbox-access.log;
    error_log /var/log/nginx/habbud/sandbox-error.log;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:3105/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
